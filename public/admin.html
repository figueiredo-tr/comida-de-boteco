<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — Comida de Boteco</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌽</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;600;700&family=Nunito+Sans:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/estilo-placar.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
      .area-admin-login {
        text-align: center;
        padding: 40px 20px;
      }
      .admin-acoes {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin: 16px 0 24px;
        flex-wrap: wrap;
      }
      .btn-exportar {
        background: var(--verde-bandeira, #2f5233);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="hero-festival" id="festivalBanner"></div>

      <div class="area-admin-login" id="areaLogin">
        <form
          id="formSenhaAdmin"
          style="
            display: inline-flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
          "
        >
          <input
            type="password"
            id="campoSenhaAdmin"
            placeholder="Senha do admin"
            style="
              padding: 12px 16px;
              border-radius: 8px;
              border: 1px solid rgba(243, 236, 216, 0.25);
              background: rgba(243, 236, 216, 0.05);
              color: var(--papel);
              font-family: &quot;JetBrains Mono&quot;, monospace;
              font-size: 14px;
              text-align: center;
            "
          />
          <button type="submit" class="entrar-google">Entrar</button>
        </form>
        <p class="admin-msg" id="adminMsg"></p>
      </div>

      <div id="areaAdmin" style="display: none">
        <div class="secao-titulo">
          <h2>🏆 Placar Geral (admin)</h2>
          <p class="subt">Ranking em tempo real dos restaurantes</p>
        </div>
        <p class="rodape-pagina">📍 Água Boa - MG</p>
        <div class="admin-acoes">
          <button type="button" class="btn-exportar" id="btnExportarPDF">
            📄 Exportar PDF
          </button>
          <button
            type="button"
            class="btn-toggle-votacao"
            id="btnTogglePublico"
          >
            Encerrar votação do público
          </button>
          <button type="button" class="btn-toggle-votacao" id="btnToggleJuri">
            Encerrar votação do júri
          </button>
          <button
            type="button"
            class="btn-toggle-votacao"
            id="btnToggleRevelacaoVoto"
          >
            Encerrar votação do Revelação
          </button>
        </div>

        <div id="relatorio">
          <div id="conteudo">
            <div class="pombinha">carregando avaliações...</div>
          </div>
        </div>

        <p class="atualizacao" id="atualizacao"></p>

        <div class="secao-titulo" style="margin-top: 40px">
          <h2>📝 Lançar cédulas de papel</h2>
          <p class="subt">
            Adiciona manualmente votos coletados fisicamente no evento
          </p>
        </div>

        <form
          id="formCedula"
          style="
            max-width: 360px;
            margin: 0 auto 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
          "
        >
          <select
            id="cedulaRestaurante"
            required
            style="
              padding: 10px 12px;
              border-radius: 8px;
              border: 1px solid rgba(243, 236, 216, 0.25);
              background: rgba(243, 236, 216, 0.05);
              color: var(--papel);
              font-family: &quot;Nunito Sans&quot;, sans-serif;
            "
          ></select>
          <input
            type="number"
            id="cedulaNota"
            min="0"
            max="10"
            step="1"
            placeholder="Nota de 0 a 10"
            required
            style="
              padding: 10px 12px;
              border-radius: 8px;
              border: 1px solid rgba(243, 236, 216, 0.25);
              background: rgba(243, 236, 216, 0.05);
              color: var(--papel);
              font-family: &quot;JetBrains Mono&quot;, monospace;
            "
          />
          <input
            type="number"
            id="cedulaQuantidade"
            min="1"
            step="1"
            value="1"
            placeholder="Quantidade de cédulas com essa nota"
            required
            style="
              padding: 10px 12px;
              border-radius: 8px;
              border: 1px solid rgba(243, 236, 216, 0.25);
              background: rgba(243, 236, 216, 0.05);
              color: var(--papel);
              font-family: &quot;JetBrains Mono&quot;, monospace;
            "
          />
          <input
            type="text"
            id="cedulaNome"
            placeholder="Observação (opcional)"
            style="
              padding: 10px 12px;
              border-radius: 8px;
              border: 1px solid rgba(243, 236, 216, 0.25);
              background: rgba(243, 236, 216, 0.05);
              color: var(--papel);
              font-family: &quot;Nunito Sans&quot;, sans-serif;
            "
          />
          <button type="submit" class="btn-exportar">Lançar cédula</button>
          <p class="admin-msg" id="cedulaMsg"></p>
        </form>

        <div id="listaCedulas"></div>

        <div class="secao-titulo" style="margin-top: 40px">
          <h2>🌟 Boteco Revelação</h2>
          <p class="subt">
            Votação do público — visível só pra você até liberar
          </p>
        </div>

        <div class="admin-acoes">
          <button
            type="button"
            class="btn-toggle-revelacao"
            id="btnToggleRevelacao"
          >
            Liberar resultado
          </button>
        </div>

        <div id="conteudoRevelacaoAdmin">
          <div class="pombinha">carregando votos...</div>
        </div>
      </div>
    </div>

    <script type="module" src="assets/admin.js"></script>
  </body>
</html>
